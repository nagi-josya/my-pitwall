name: Build and Deploy

on:
  push:
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.x'
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build backend
        run: |
          dotnet restore backend/MyPitwall.sln
          dotnet publish backend/MyPitwall.sln -c Release -o publish/backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:5170/api' }}
        run: |
          cd frontend/my-pitwall-ui
          npm ci
          sed -i "s|http://localhost:5170/api|$API_BASE_URL|g" src/environments/environment.ts
          npx ng build --configuration production

      - name: Show build output
        run: |
          ls -R frontend/my-pitwall-ui/dist

      - name: Install Wrangler
        run: npm install -g wrangler@4.107.0

      - name: Verify versions
        run: |
          node --version
          npm --version
          wrangler --version

      - name: Deploy frontend
        working-directory: frontend/my-pitwall-ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy